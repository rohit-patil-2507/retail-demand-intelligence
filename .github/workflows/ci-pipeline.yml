# .github/workflows/ci-pipeline.yml
name: Retail Intelligence CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install the local src package so scripts can import it
        pip install -e .

    - name: Syntax & Lint Check (flake8)
      run: |
        # Check src/ and app/ for critical Python errors
        flake8 src/ app/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Application Smoke Test
      run: |
        # Verify the Streamlit app compiles without fatal import errors
        python -c "import app.streamlit_app; print('Streamlit app imported successfully.')"